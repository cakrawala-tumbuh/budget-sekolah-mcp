name: Release — GitHub Release & Push Image ke GHCR

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    name: Build Image Multi-arch, Push ke GHCR
    uses: andhit-r/release-docker-image-ghcr/.github/workflows/ghcr.yml@v2
    with:
      dockerfile: Dockerfile
      target: production
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  github-release:
    name: Buat GitHub Release
    needs: docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buat GitHub Release otomatis
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
